<main class="login-page">
  <a class="back-link" routerLink="/">← Back to website</a>

  <section class="login-card" aria-labelledby="admin-login-title">
    <div class="brand-panel">
      <img src="assets/images/jos-logo.jpeg" alt="Jo's House of Subs">
      <div>
        <span>Private staff area</span>
        <strong>Restaurant control</strong>
      </div>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
      <p class="eyebrow">Authorized staff only</p>
      <h1 id="admin-login-title">Welcome<br><em>back.</em></h1>
  <p class="intro">
  Sign in with the shared staff account or the super-administrator account.
</p>

      <label>
        <span>Username</span>
        <input type="text" formControlName="username" autocomplete="username">
      </label>
      <small *ngIf="loginForm.controls.username.touched && loginForm.controls.username.invalid">
        Username is required.
      </small>

      <label>
        <span>Password</span>
        <input type="password" formControlName="password" autocomplete="current-password">
      </label>
      <small *ngIf="loginForm.controls.password.touched && loginForm.controls.password.invalid">
        Enter your staff password.
      </small>

      <div class="error-message" *ngIf="errorMessage" role="alert">{{ errorMessage }}</div>

      <button type="submit" [disabled]="submitting">
        {{ submitting ? 'Signing in…' : 'Sign in' }} <span>→</span>
      </button>
    </form>
  </section>
</main>
