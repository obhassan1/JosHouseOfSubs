<header class="site-header">
  <a class="brand" href="#top" aria-label="Jo's House of Subs home" (click)="closeMenu()">
    <img src="assets/images/jos-logo.jpeg" alt="Jo's House of Subs">
  </a>

  <nav class="desktop-nav" aria-label="Main navigation">
    <a class="nav-link active" href="#top">Home</a>
    <a class="nav-link" href="#bestsellers">Bestsellers</a>
    <a class="nav-link" href="#why-jos">Why JO's</a>
    <a class="nav-link" href="#social">Reviews</a>
    <a class="nav-link" href="#visit">Visit</a>
  </nav>

  <a
    class="header-cta"
    href="https://wa.me/9613596091?text=Hi%20Jo%27s!%20I%27d%20like%20to%20place%20an%20order."
    target="_blank"
    rel="noreferrer">
    Order now <span aria-hidden="true">↗</span>
  </a>

  <button
    class="menu-toggle"
    type="button"
    aria-label="Toggle navigation"
    [attr.aria-expanded]="menuOpen"
    aria-controls="mobile-navigation"
    (click)="toggleMenu()">
    <span></span><span></span><span></span>
  </button>

  <nav
    id="mobile-navigation"
    class="mobile-nav"
    [class.open]="menuOpen"
    aria-label="Mobile navigation">
    <a href="#top" (click)="closeMenu()">Home</a>
    <a href="#bestsellers" (click)="closeMenu()">Bestsellers</a>
    <a href="#why-jos" (click)="closeMenu()">Why JO's</a>
    <a href="#social" (click)="closeMenu()">Reviews</a>
    <a href="#visit" (click)="closeMenu()">Visit</a>
  </nav>
</header>
